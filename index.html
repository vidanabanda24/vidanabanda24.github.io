<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>24 Horas na Banda</title>
<style>
:root{--bg:#fff8ec;--card:#ffffff;--tx:#1d1d1b;--mut:#6b6558;--ac:#d9480f;--bd:#e7dcc6;--ok:#2f9e44;--bad:#e03131;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17140f;--card:#221e17;--tx:#f4ead7;--mut:#a89f8c;--ac:#ff922b;--bd:#3a3326;--ok:#51cf66;--bad:#ff6b6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17140f;--card:#221e17;--tx:#f4ead7;--mut:#a89f8c;--ac:#ff922b;--bd:#3a3326;--ok:#51cf66;--bad:#ff6b6b;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--mut);font-size:13px;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.clock{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:20px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:3px 0 8px}
.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.st{font-size:13px;display:flex;justify-content:space-between}
.log{font-size:14px;min-height:48px;line-height:1.4}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:left;cursor:pointer}
button small{display:block;color:var(--mut);font-size:12px}
button:hover:not(:disabled){border-color:var(--ac)}
button:disabled{opacity:.4;cursor:not-allowed}
.big{background:var(--ac);color:#fff;border:0;text-align:center;font-weight:700;width:100%}
input{width:100%;font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px}
.msg{color:var(--bad);font-size:13px;min-height:18px;margin-bottom:6px}
.rk{font-size:14px;display:flex;justify-content:space-between;padding:3px 0}
.ev{border-color:var(--ac);animation:sh .4s}
#mb{width:auto}
.tb{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.tb th{text-align:left;color:var(--mut);font-weight:600;border-bottom:1px solid var(--bd);padding:4px}
.tb td{padding:7px 4px;border-bottom:1px solid var(--bd)}
.tb td:nth-child(2){text-transform:capitalize}
.tb tr.me td{background:rgba(255,160,0,.18);font-weight:700}
:root[data-karma="good"]{--bg:#fff4cf;--card:#fffdf4;--tx:#2a2112;--mut:#7a6a45;--ac:#e8590c;--bd:#f1d98a;--ok:#2f9e44;--bad:#e03131;color-scheme:light}
:root[data-karma="great"]{--bg:#ffefb0;--card:#fffef8;--tx:#2a2112;--mut:#7a6a45;--ac:#d9480f;--bd:#f3c94c;--ok:#2f9e44;--bad:#e03131;color-scheme:light}
:root[data-karma="bad"]{--bg:#1a0f0f;--card:#271414;--tx:#f3dcdc;--mut:#b08a8a;--ac:#ff4d4d;--bd:#5a2222;--ok:#51cf66;--bad:#ff6b6b;color-scheme:dark}
:root[data-karma="evil"]{--bg:#0a0505;--card:#1b0b0b;--tx:#f6d5d5;--mut:#a87878;--ac:#ff2b2b;--bd:#7a1515;--ok:#51cf66;--bad:#ff6b6b;color-scheme:dark}
:root[data-karma="good"] .card,:root[data-karma="great"] .card{border-radius:20px;box-shadow:0 6px 18px rgba(232,89,12,.15)}
:root[data-karma="great"] .card{border-color:#f3c94c;box-shadow:0 0 22px rgba(255,196,0,.45)}
:root[data-karma="great"] h1{background:linear-gradient(90deg,#f59f00,#e8590c,#f59f00);-webkit-background-clip:text;background-clip:text;color:transparent}
:root[data-karma="bad"] .card,:root[data-karma="evil"] .card{border-radius:3px;border-style:dashed}
:root[data-karma="evil"] .card{box-shadow:0 0 14px rgba(255,0,0,.25);animation:flick 5s infinite}
:root[data-karma="evil"] h1{animation:gl 1.3s infinite;color:#ff4040}
:root[data-karma="bad"] body::after,:root[data-karma="evil"] body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:5;box-shadow:inset 0 0 140px rgba(150,0,0,.5)}
:root[data-karma="good"] body::after,:root[data-karma="great"] body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:5;box-shadow:inset 0 0 120px rgba(255,200,60,.28)}
@keyframes gl{0%,100%{text-shadow:2px 0 #0ff,-2px 0 #f0f}50%{text-shadow:-3px 0 #0ff,3px 0 #f0f;transform:translateX(2px)}92%{transform:skewX(8deg)}}
@keyframes flick{0%,94%,100%{opacity:1}96%{opacity:.6}98%{opacity:.9}}
.pop{position:fixed;left:50%;top:40%;transform:translateX(-50%);font-weight:800;font-size:28px;pointer-events:none;animation:up 1s forwards;z-index:20}
.cf{position:fixed;top:-20px;font-size:22px;pointer-events:none;animation:fall 2.5s linear forwards;z-index:20}
@keyframes up{to{transform:translate(-50%,-80px);opacity:0}}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ev button{margin-top:6px;width:100%}
</style>
</head>
<body>
<div class="w" id="app"></div>
<button id="ab" onclick="admOpen()" style="display:none;position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:56px;z-index:30;padding:6px 10px;width:auto">🛠️ ADM</button>
<button id="mb" onclick="toggleMute()" aria-label="Som" style="position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:8px;z-index:30;padding:6px 10px">🔊</button>
<script>
const $=id=>document.getElementById(id);
const A=document.getElementById('app');
let S,U=null;
let DB={};try{DB=JSON.parse(localStorage.getItem('vnb_users')||'{}')}catch(e){}
function saveDB(){try{localStorage.setItem('vnb_users',JSON.stringify(DB))}catch(e){}}
async function hash(p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('vnb:'+p));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
function esc(s){return String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';')}
function loginScreen(msg){
 A.innerHTML=`<h1>🏙️ 24 Horas na Banda</h1><div class="sub">Entra ou cria a tua conta para guardares o teu recorde.</div><div class="card"><input id="u" placeholder="Nome de utilizador" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="20"><input id="p" type="password" placeholder="Palavra-passe (mín. 4)" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false"><div class="msg">${msg||''}</div><button class="big" onclick="auth('in')">Entrar</button><button class="big" style="margin-top:8px;background:var(--card);color:var(--tx);border:1px solid var(--bd)" onclick="auth('up')">Criar conta</button></div><div class="sub">As contas ficam guardadas neste dispositivo/navegador.</div><button style="width:100%;margin-top:8px" onclick="showBoard()">🏆 Tabela de maior pontuação</button>`
}
async function auth(mode){
 const u=$('u').value.trim().toLowerCase(),p=$('p').value.trim();
 if(u.length<3||p.length<4)return loginScreen('Nome (mín. 3) e palavra-passe (mín. 4).');
 let h;try{h=await hash(p)}catch(e){return loginScreen('Erro ao processar a palavra-passe.')}
 if(u===ADM){if(mode==='up')return loginScreen('Esse nome está reservado.');if(h!==ADM_HASH)return loginScreen('Nome ou palavra-passe errados.');if(!DB[u])DB[u]={h,best:0,games:0};DB[u].h=h;saveDB()}else if(mode==='up'){if(DB[u])return loginScreen('Esse nome já existe.');DB[u]={h,best:0,games:0};saveDB()}
 else if(!DB[u]||DB[u].h!==h)return loginScreen('Nome ou palavra-passe errados.');
 U=u;music();updAdm();start()
}
function logout(){U=null;updAdm();document.documentElement.removeAttribute('data-karma');LV='';loginScreen()}
function rank(){const r=Object.entries(DB).sort((a,b)=>b[1].best-a[1].best).slice(0,5);return '<div style="margin-top:10px"><b>🏆 Ranking</b>'+r.map((x,i)=>`<div class="rk"><span>${i+1}. ${esc(x[0])}</span><span>${x[1].best}</span></div>`).join('')+'</div>'}
const clamp=(v)=>Math.max(0,Math.min(100,v));
function fmtH(h){const t=(6+h)%24;return String(Math.floor(t)).padStart(2,'0')+':00'}
const BAIRROS={"Cazenga":{kz:2500,en:80,fo:60,fe:55,re:20,d:"Malta unida, mais reputação"},"Kilamba":{kz:4000,en:75,fo:70,fe:60,re:5,d:"Mais dinheiro, menos contactos"},"Ilha de Luanda":{kz:1800,en:80,fo:60,fe:85,re:10,d:"Mais felicidade"},"Sambizanga":{kz:2000,en:90,fo:50,fe:50,re:30,d:"Muita energia e respeito"}};
const BK=Object.keys(BAIRROS);
let HARD=false,NEW=[],AU=null;
function beep(f){if(MUTE)return;try{AU=AU||new (window.AudioContext||window.webkitAudioContext)();const o=AU.createOscillator(),g=AU.createGain();o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(AU.destination);o.start();o.stop(AU.currentTime+.12)}catch(e){}}
const AC=[
 {id:'rico',t:'💰 Milionário da Banda (Kz 10.000+)',ck:s=>s.kz>=10000},
 {id:'amigo',t:'🤝 Amigo de todos (reputação 80+)',ck:s=>s.re>=80},
 {id:'feliz',t:'😊 Alma feliz (felicidade 90+)',ck:s=>s.fe>=90},
 {id:'limite',t:'😰 No limite (energia 10 ou menos)',ck:s=>s.en<=10},
 {id:'rei',t:'👑 Rei da Banda (600+ pontos)',ck:(s,sc)=>sc>600},
 {id:'missoes',t:'🎯 Missão cumprida (3 em 3)',ck:s=>s.ms.every(m=>m.ck(s))},
 {id:'turista',t:'🗺️ Conheces Luanda (jogaste os 4 bairros)',ck:(s,sc,r)=>r.bs.length>=BK.length},
 {id:'santo',t:'😇 Santo da Banda (karma 60+)',ck:s=>(s.kar||0)>=60},
 {id:'maldito',t:'😈 Perdido no crime (karma -60)',ck:s=>(s.kar||0)<=-60},
 {id:'respeito',t:'🕶️ Respeitado no submundo (respeito 50+)',ck:s=>(s.rs||0)>=50},
 {id:'cadeia',t:'🚔 Passaste pela esquadra',ck:s=>!!s.jail},
 {id:'dificil',t:'🔥 Sobrevivente do modo difícil',ck:s=>!!s.hard}
];
let MUTE=false,tm=null,step=0,nx=0;
try{MUTE=localStorage.getItem('vnb_mute')==='1'}catch(e){}
function ctx(){try{AU=AU||new (window.AudioContext||window.webkitAudioContext)();if(AU.state==='suspended')AU.resume();return AU}catch(e){return null}}
function tone(f,t,d,type,v){const o=AU.createOscillator(),g=AU.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AU.destination);o.start(t);o.stop(t+d)}
function kick(t){const o=AU.createOscillator(),g=AU.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.0001,t+.2);o.connect(g);g.connect(AU.destination);o.start(t);o.stop(t+.2)}
function hat(t){const n=AU.createBuffer(1,1200,AU.sampleRate),d=n.getChannelData(0);for(let i=0;i<1200;i++)d[i]=Math.random()*2-1;const s=AU.createBufferSource(),g=AU.createGain(),f=AU.createBiquadFilter();f.type='highpass';f.frequency.value=7000;s.buffer=n;g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.0001,t+.05);s.connect(f);f.connect(g);g.connect(AU.destination);s.start(t)}
const BASS=[110,0,110,0,165,0,147,0,131,0,131,0,165,0,147,0],LEAD=[440,0,523,0,494,0,440,0,392,0,440,0,523,0,587,0];
function sched(){
 if(!AU||MUTE){tm=null;return}
 const night=S&&S.b&&!isDay(),sl=60/(night?128:98)/4;
 while(nx<AU.currentTime+.25){const i=step%16;
  if(i%4===0||(night&&i%8===6))kick(nx);
  if(i%2===0)hat(nx);
  if(BASS[i])tone(BASS[i],nx,sl*1.8,'triangle',.16);
  if(LEAD[i]&&(step>>4)%2===1)tone(LEAD[i]*((S&&S.kar<=-25)?.5:1),nx,sl*1.5,(S&&S.kar<=-25)?'sawtooth':'square',.03);
  nx+=sl;step++}
 tm=setTimeout(sched,100)
}
function music(){if(MUTE||!ctx()||tm)return;nx=AU.currentTime+.05;sched()}
function updMute(){const b=$('mb');if(b)b.textContent=MUTE?'🔇':'🔊'}
function toggleMute(){MUTE=!MUTE;try{localStorage.setItem('vnb_mute',MUTE?'1':'0')}catch(e){}if(MUTE){clearTimeout(tm);tm=null}else music();updMute()}
function vib(n){try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}}
function pop(d){if(!d)return;const e=document.createElement('div');e.className='pop';e.style.color=d>0?'var(--ok)':'var(--bad)';e.textContent=(d>0?'+':'−')+'Kz '+Math.abs(d).toLocaleString('pt-PT');document.body.appendChild(e);setTimeout(()=>e.remove(),1000)}
function confetti(){const em=['🎉','✨','🎊','💰','⭐'];for(let i=0;i<30;i++){const e=document.createElement('span');e.className='cf';e.textContent=em[i%5];e.style.left=Math.random()*100+'%';e.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),3500)}}
function fanfare(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f),i*140))}
function betUI(){const m=S.kz,a=S.amt,f=v=>v.toLocaleString('pt-PT');
 const chips=[500,1000,2000,5000].filter(v=>v<m).map(v=>`<button style="flex:1;text-align:center" onclick="setBet(${v})">${f(v)}</button>`).join('')+`<button style="flex:1;text-align:center" onclick="setBet(${m})">Tudo</button>`;
 return `<div class="card ev"><b>🎰 Quanto queres apostar?</b><div class="sub" style="margin:6px 0">Tens Kz ${f(m)}. ${S.hard?35:40}% de ganhar e receber 2,5x o valor apostado.</div><div id="bv" style="font-size:26px;font-weight:800;text-align:center;margin:6px 0">Kz ${f(a)}</div><input type="range" min="500" max="${m}" step="100" value="${a}" style="padding:0;border:0" oninput="S.amt=+this.value;document.getElementById('bv').textContent='Kz '+S.amt.toLocaleString('pt-PT')"><div style="display:flex;gap:6px;margin:8px 0">${chips}</div>${a>m/2?'<div class="msg">⚠️ Cuidado: é mais de metade do teu dinheiro!</div>':''}<button class="big" onclick="placeBet()">🎲 Apostar</button><button style="width:100%;margin-top:6px;text-align:center" onclick="cancelBet()">❌ Desistir</button></div>`}
function setBet(v){S.amt=Math.max(500,Math.min(v,S.kz));draw()}
function cancelBet(){S.bet=false;draw()}
function placeBet(){const b=Math.min(S.amt,S.kz);if(b<500)return;addK(-4);const f=v=>v.toLocaleString('pt-PT');S.bet=false;S.cnt[19]=(S.cnt[19]||0)+1;S.kz-=b;const w=Math.random()<(S.hard?.35:.4);
 if(w){const g=Math.round(b*2.5);S.kz+=g;S.fe+=15;S.log='🎉 Ganhaste! Apostaste Kz '+f(b)+' e recebeste Kz '+f(g)+'.'}
 else{S.fe-=b>=2000?15:10;S.log='💸 Perdeste Kz '+f(b)+'. A casa ganha sempre…'}
 pop(w?Math.round(b*1.5):-b);beep(w?880:300);after(acts[19])}
const FAM=[{n:'🐍 Gangue da Zona Norte',d:'Rua e pequenos roubos. Risco médio.',r:.30,m:1},{n:'🦅 Família Mukanda',d:'Contrabando e negócios. Paga bem.',r:.35,m:1.4},{n:'🦂 Máfia do Porto',d:'Contentores e subornos. Muito dinheiro, muito perigo.',r:.45,m:2}];
const JOBS=[{n:'👀 Fazer de vigia',h:1,k:1200,r:.10,res:5,heat:6,min:0},{n:'📦 Entregar encomenda',h:2,k:3000,r:.25,res:8,heat:12,min:0},{n:'💵 Cobrar uma dívida',h:2,k:4500,r:.35,res:12,heat:16,min:20},{n:'🏦 Grande assalto',h:3,k:12000,r:.55,res:25,heat:30,min:40}];
const RAID={t:'🚨 A polícia faz uma rusga no bairro! Estás muito procurado.',o:[['Esconder-te',s=>{s.en-=10;s.heat=Math.max(0,(s.heat||0)-20);return'Ficaste quieto até passar o perigo.'}],['Fugir',s=>{if(Math.random()<.5){s.heat=Math.max(0,(s.heat||0)-10);return'Escapaste por pouco!'}s.kz=Math.max(0,s.kz-1500);s.fe-=12;s.jail=1;return'Apanharam-te e levaste multa de Kz 1.500.'}]]};
function jobP(j){return Math.min(.9,Math.max(.05,j.r+(S.heat||0)/250+(FAM[S.gang].r-.3)*.5-(S.rs||0)/400))}
function crimeUI(){const f=v=>v.toLocaleString('pt-PT');
 if(S.gang==null){return `<div class="card ev"><b>🕶️ O Submundo</b><div class="sub" style="margin:6px 0">Alguém sussurra que podes entrar numa família. O dinheiro é rápido, mas a polícia também. Escolhe com cuidado.</div>`+FAM.map((x,i)=>`<button style="width:100%;margin-bottom:6px" onclick="joinG(${i})">${x.n}<small>${x.d}</small></button>`).join('')+`<button style="width:100%;text-align:center" onclick="closeC()">↩️ Voltar à vida normal</button></div>`}
 const g=FAM[S.gang];
 return `<div class="card ev"><b>${g.n}</b><div class="sub" style="margin:6px 0">Quanto mais procurado estiveres, maior a hipótese de seres apanhado. Ganhar respeito desbloqueia trabalhos maiores.</div>`+JOBS.map((j,i)=>{const lock=(S.rs||0)<j.min||S.h+j.h>24||S.en<10;return `<button style="width:100%;margin-bottom:6px" ${lock?'disabled':''} onclick="doJob(${i})">${j.n}<small>${j.h}h · Kz ${f(Math.round(j.k*g.m))} · risco de ser apanhado ${Math.round(jobP(j)*100)}%${j.min?' · respeito '+j.min+'+':''}</small></button>`}).join('')+`<button style="width:100%;margin-bottom:6px" ${S.kz<2000?'disabled':''} onclick="bribe()">🤑 Subornar um polícia<small>-Kz 2.000 · -30 procurado</small></button><button style="width:100%;margin-bottom:6px" onclick="leaveG()">🚪 Sair da família<small>Podem não gostar...</small></button><button style="width:100%;text-align:center" onclick="closeC()">↩️ Fechar</button></div>`}
function joinG(i){S.gang=i;S.rs=10;S.heat=S.heat||0;S.log='Aceitaram-te na família. Agora tens de provar o teu valor.';beep(200);setTimeout(()=>beep(150),150);draw()}
function closeC(){S.crime=false;draw()}
function bribe(){addK(-8);if(S.kz<2000)return;S.kz-=2000;S.heat=Math.max(0,(S.heat||0)-30);S.log='O agente guardou a nota no bolso e olhou para o outro lado.';pop(-2000);beep(400);draw()}
function leaveG(){addK(10);S.gang=null;S.rs=0;S.crime=false;if(Math.random()<.35){const l=Math.min(S.kz,1000);S.kz-=l;S.fe-=10;S.log='Saíste da família, mas eles não gostaram: levaram Kz '+l+'.';pop(-l);beep(250)}else S.log='Saíste da família sem problemas.';draw()}
function doJob(i){const j=JOBS[i],g=FAM[S.gang],f=v=>v.toLocaleString('pt-PT');S.crime=false;S.cnt[21]=(S.cnt[21]||0)+1;addK(-(8+Math.round(j.heat/2)));S.en-=10;S.fo-=6;
 const caught=Math.random()<jobP(j);
 if(!caught){const k=Math.round(j.k*g.m);S.kz+=k;S.rs=Math.min(100,(S.rs||0)+j.res);S.heat=Math.min(100,(S.heat||0)+j.heat);S.re=Math.max(0,S.re-2);S.fe+=6;S.log=j.n+' correu bem! Ganhaste Kz '+f(k)+' e mais respeito na família.';pop(k);beep(700)}
 else{S.jail=1;const bail=(S.rs||0)>=30,loss=bail?0:Math.min(S.kz,1500);S.kz-=loss;S.fe-=15;S.re=Math.max(0,S.re-8);S.rs=Math.max(0,(S.rs||0)-5);S.heat=Math.round((S.heat||0)/2);S.log='🚔 Foste apanhado! '+(bail?'A família pagou a tua fiança.':'Pagaste Kz '+f(loss)+' de multa.')+' Perdeste horas na esquadra.';if(loss)pop(-loss);beep(250);vib(200)}
 after({h:caught?j.h+3:j.h})}
const ADM='pedro da silva',ADM_HASH='138372230935bfe7cb7b2c95d31190d68ed393abd59b328d06b03a14dcc9e489';
function isAdm(){return U===ADM}
function updAdm(){const b=$('ab');if(b)b.style.display=isAdm()?'block':'none';const o=$('adm');if(o&&!isAdm())o.remove()}

 if(S.fo<=0){S.en-=15;S.fe-=10;S.log+=" Estás com muita fome!"}
 S.en=clamp(S.en);S.fe=clamp(S.fe);
 if(S.h>=24||S.en<=0&&S.fe<=0){S.end=true}
 else if(Math.random()<(isDay()?.4:.55)+(S.hard?.2:0)){S.ev=(S.heat>=70&&Math.random()<.6)?RAID:events[Math.floor(Math.random()*events.length)];beep(520);setTimeout(()=>beep(420),130);vib(60)}
 draw()
}
function doAct(i){if(i===21){music();S.crime=true;draw();return}if(i===19){music();S.bet=true;S.amt=Math.min(1000,S.kz);draw();return}const a=acts[i];const k0=S.kz;music();addK(KAR[i]||0);S.cnt[i]=(S.cnt[i]||0)+1;S.log=a.f(S);pop(S.kz-k0);beep(S.kz>k0?660:380);after(a)}
function doEv(i){const k0=S.kz;addK(((KEV[events.indexOf(S.ev)]||[])[i])||0);S.log=S.ev.o[i][1](S);pop(S.kz-k0);beep(S.kz>=k0?600:350);S.ev=null;S.en=clamp(S.en);S.fe=clamp(S.fe);S.re=clamp(S.re);if(S.h>=24)S.end=true;draw()}
function bar(l,v,inv){return `<div class="st"><span>${l}</span><span>${Math.round(v)}</span></div><div class="bar"><i style="width:${v}%;${(inv?v>=70:v<25)?'background:var(--bad)':''}"></i></div>`}
function draw(){theme();
 if(S.end)return fim();
 let h=`<h1>${S.kar>=25?'🌇':S.kar<=-25?'🌑':'🏙️'} 24 Horas na Banda</h1><div class="sub">👤 ${esc(U)} · Recorde: ${DB[U]?DB[U].best:0} · 📍 ${S.b} · <a href="#" onclick="logout();return false" style="color:var(--ac)">Sair</a></div>
 <div class="card clock"><span>${isDay()?'☀️':'🌙'} ${fmtH(S.h)}</span><span>💰 Kz ${S.kz.toLocaleString('pt-PT')}</span></div>
 <div class="card">${bar('⚡ Energia',S.en)}${bar('🍽️ Fome (saciedade)',S.fo)}${bar('😊 Felicidade',S.fe)}${bar('🤝 Reputação',S.re)}${karBar()}${S.gang!=null||S.heat?bar('🚨 Procurado pela polícia',S.heat||0,1)+(S.gang!=null?bar('🕶️ Respeito na família',S.rs||0):''):''}</div>
 <div class="card log">${S.log}</div>
 <div class="card" style="font-size:13px"><b>🎯 Missões (+60 pontos cada)</b>${S.ms.map(m=>`<div>${m.ck(S)?'✅':'⬜'} ${m.t}</div>`).join('')}</div>`;
 if(S.ev){h+=`<div class="card ev"><b>${S.ev.t}</b>${S.ev.o.map((o,i)=>`<button onclick="doEv(${i})">${o[0]}</button>`).join('')}</div>`}
 else if(S.bet){h+=betUI()}
 else if(S.crime){h+=crimeUI()}
 else{h+=`<div class="acts">${acts.map((a,i)=>`<button ${(a.c(S)&&S.h+a.h<=24&&okTime(i))?'':'disabled'} onclick="doAct(${i})">${a.n}<small>${a.d}${tag(i)}</small></button>`).join('')}</div>`}
 A.innerHTML=h
}
function fim(){
 const ok=S.ms.filter(m=>m.ck(S)).length;const sc=Math.round((S.kz/100+S.en+S.fo+S.fe*1.5+S.re*2+ok*60)*(S.hard?1.5:1));
 NEW=[];if(U&&DB[U]){const r=DB[U];r.games++;if(sc>r.best){r.best=sc;r.bb=S.b;r.bh=!!S.hard}r.ach=r.ach||[];r.bs=r.bs||[];if(!r.bs.includes(S.b))r.bs.push(S.b);AC.forEach(a=>{if(!r.ach.includes(a.id)&&a.ck(S,sc,r)){r.ach.push(a.id);NEW.push(a.id)}});saveDB();if(NEW.length)beep(880)}
 if(sc>450){confetti();fanfare();vib(150)}
 let t=sc>600?"👑 Rei/Rainha da Banda":sc>450?"🔥 Malandro de respeito":sc>300?"🙂 Tás a safar-te bem":sc>150?"😅 Foi duro, mas sobreviveste":"💀 A banda não perdoou";
 A.innerHTML=`<h1>${endEmoji()} Amanheceu!</h1>${ending()}<div class="card"><div style="font-size:20px;font-weight:700">${t}</div><p>Pontuação: <b>${sc}</b></p>${S.ms.map(m=>`<div class="st"><span>${m.ck(S)?'✅':'❌'} ${m.t}</span><span>${m.ck(S)?'+60':'0'}</span></div>`).join('')}<br>
 <div class="st"><span>Dinheiro</span><span>Kz ${S.kz.toLocaleString('pt-PT')}</span></div><div class="st"><span>Energia</span><span>${Math.round(S.en)}</span></div><div class="st"><span>Felicidade</span><span>${Math.round(S.fe)}</span></div><div class="st"><span>Reputação</span><span>${Math.round(S.re)}</span></div></div>
 ${ach()}${board(10)}<button class="big" style="margin-bottom:8px" onclick="start()">🔄 Jogar outra vez</button><button class="big" style="background:var(--card);color:var(--tx);border:1px solid var(--bd)" onclick="logout()">🚪 Sair da conta</button>`
}
updMute();loginScreen();
</script>
